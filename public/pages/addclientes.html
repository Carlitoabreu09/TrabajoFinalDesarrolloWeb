<h2 class="text-center mt-4">Agregar Cliente</h2>

<div class="container mt-4">
    <div class="formulario-cliente container py-4">

        <div class="mb-3">
            <label for="codigoCli" class="form-label">Código</label>
            <input type="text" class="form-control input-ovalado" id="codigoCli" placeholder="Ingrese el código">
        </div>

        <div class="mb-3">
            <label for="nombreCli" class="form-label">Nombre</label>
            <input type="text" class="form-control input-ovalado" id="nombreCli" placeholder="Ingrese el nombre">
        </div>

        <div class="mb-3">
            <label for="direccionCli" class="form-label">Dirección</label>
            <input type="text" class="form-control input-ovalado" id="direccionCli" placeholder="Ingrese la dirección">
        </div>

        <div class="mb-3">
            <label for="telefonoCli" class="form-label">Teléfono</label>
            <input type="text" class="form-control input-ovalado" id="telefonoCli" placeholder="Ingrese el teléfono">
        </div>

        <div class="mb-3">
            <label for="rncCli" class="form-label">RNC</label>
            <input type="text" class="form-control input-ovalado" id="rncCli" placeholder="Ingrese al RNC">
        </div>

        <div class="d-flex justify-content-between align-items-center mt-4">
            <button class="btn btn-secondary btn-lg" data-page="/pages/clientes.html">
                ← Regresar
            </button>

            <button id="btnAgregarCliente" class="btn btn-primary btn-lg">
                Agregar Cliente <i class="fas fa-user-plus"></i>
            </button>
        </div>
    </div>
</div>
