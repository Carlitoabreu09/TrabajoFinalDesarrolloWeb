<h2 class="text-center mt-4">Agregar Producto</h2>

<div class="container mt-4">
    <div class="formulario-producto container py-4">

        <div class="mb-3">
            <label for="codigoInput" class="form-label">Código</label>
            <input type="text" class="form-control input-ovalado" id="codigoInput" placeholder="Ingrese el código">
        </div>

        <div class="mb-3">
            <label for="nombreInput" class="form-label">Nombre</label>
            <input type="text" class="form-control input-ovalado" id="nombreInput" placeholder="Ingrese el nombre">
        </div>

        <div class="mb-3">
            <label for="precioInput" class="form-label">Precio</label>
            <input type="text" class="form-control input-ovalado" id="precioInput" placeholder="Ingrese el precio">
        </div>

        <div class="mb-3">
            <label for="cantidadInput" class="form-label">Cantidad</label>
            <input type="number" class="form-control input-ovalado" id="cantidadInput" placeholder="Ingrese la cantidad">
        </div>

        <div class="d-flex justify-content-between align-items-center mt-4">
            <button class="btn btn-secondary btn-lg" data-page="/pages/productos.html">
                ← Regresar
            </button>

            <button id="btnAgregarProducto" class="btn btn-primary btn-lg">
                Agregar Producto <i class="fa fa-cart-plus"></i>
            </button>
        </div>
    </div>
</div>
